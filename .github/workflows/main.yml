name: Flutter CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  analyze_and_test:
    name: Analizar Probar y Validar Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar Dependencias
        run: flutter pub get

      - name: Crear archivo .env ficticio para validacion
        run: touch .env

      - name: Validar Formateo
        run: dart format --output=none --set-exit-if-changed .

      - name: Analisis Estatico
        run: flutter analyze

      - name: Ejecutar Tests Automatizados
        run: flutter test

  build_android:
    name: Compilar y Firmar Android App Bundle (Produccion)
    needs: analyze_and_test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar Dependencias de Flutter
        run: flutter pub get

      - name: Descargar artefactos y herramientas de Android
        run: flutter precache --android

      - name: Inyectar variables de entorno de Supabase
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Preparar y Decodificar Keystore de Produccion
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Compilar Android App Bundle (.aab) con Auto-Incremento y Firma Nativa
        run: |
          flutter build appbundle --release --build-number=$GITHUB_RUN_NUMBER
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Almacenar Bundle de Produccion Compilado (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: trueke-production-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
