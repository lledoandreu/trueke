name: Flutter CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  analyze_and_test:
    name: Analizar Probar y Validar Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar Dependencias
        run: flutter pub get

      - name: Crear archivo .env ficticio para validacion
        run: touch .env

      - name: Validar Formateo
        run: dart format --output=none --set-exit-if-changed .

      - name: Analisis Estatico
        run: flutter analyze

      - name: Ejecutar Tests Automatizados
        run: flutter test

  build_android:
    name: Compilar y Firmar Android App Bundle (Produccion)
    needs: analyze_and_test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar Dependencias de Flutter
        run: flutter pub get

      - name: Descargar artefactos y herramientas de Android
        run: flutter precache --android

      - name: Inyectar variables de entorno de Supabase
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Inyectar Man希esto Remoto Inquebrantable con Printf
        run: |
          rm -f android/app/src/main/AndroidManifest.xml
          printf '<manifest xmlns:android="http://android.com">\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <application android:label="trueke" android:name="${applicationName}" android:icon="@mipmap/ic_launcher">\n        <activity android:name="io.flutter.embedding.android.FlutterActivity" android:exported="true" android:launchMode="singleTop" android:taskAffinity="" android:theme="@style/LaunchTheme" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode" android:hardwareAccelerated="true" android:windowSoftInputMode="adjustResize">\n            <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme" />\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN"/>\n                <category android:name="android.intent.category.LAUNCHER"/>\n            </intent-filter>\n        </activity>\n        <meta-data android:name="flutterEmbedding" android:value="2" />\n    </application>\n    <queries>\n        <intent>\n            <action android:name="android.intent.action.PROCESS_TEXT"/>\n            <data android:mimeType="text/plain"/>\n        </intent>\n    </queries>\n</manifest>\n' > android/app/src/main/AndroidManifest.xml
          chmod 644 android/app/src/main/AndroidManifest.xml

      - name: Preparar y Decodificar Keystore de Produccion
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Compilar Android App Bundle (.aab) con Auto-Incremento y Firma Nativa
        run: |
          flutter build appbundle --release --build-number=$GITHUB_RUN_NUMBER
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Almacenar Bundle de Produccion Compilado (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: trueke-production-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
