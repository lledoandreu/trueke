name: Trueke Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Crear release Trueke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar código
        run: flutter analyze

      - name: Ejecutar tests
        run: flutter test

      - name: Verificar formato
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Validar versión
        run: |
          RELEASE_TAG="${{ github.ref_name }}"
          VERSION="${RELEASE_TAG#v}"
          CURRENT_VERSION="$(grep '^version:' pubspec.yaml | sed 's/^version: //; s/+.*//')"

          if [ "$VERSION" != "$CURRENT_VERSION" ]; then
            echo "ERROR: El tag lanzado ($VERSION) no coincide con la versión de pubspec.yaml ($CURRENT_VERSION)"
            exit 1
          fi

      - name: Crear GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Trueke ${{ github.ref_name }}" \
            --generate-notes
