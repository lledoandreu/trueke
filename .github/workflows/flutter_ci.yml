name: Flutter CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze_and_test:
    name: Analizar Probar y Validar Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar Dependencias
        run: flutter pub get

      - name: Crear archivo .env ficticio para validacion
        run: touch .env

      - name: Validar Formateo
        run: dart format --output=none --set-exit-if-changed .

      - name: Analisis Estatico
        run: flutter analyze

      - name: Ejecutar Tests Automatizados
        run: flutter test
